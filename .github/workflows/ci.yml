name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amma_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amma_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amma_test
      APP_URL: http://localhost:3100
      APP_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      # The browser tests run the production build with the dev SMS/payment/storage providers.
      ALLOW_DEV_PROVIDERS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep traces if the browser tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production dependencies only; fail on critical. (Dev-tool advisories, e.g. in the Prisma CLI, are reviewed by Dependabot.)
      - run: npm audit --omit=dev --audit-level=critical
