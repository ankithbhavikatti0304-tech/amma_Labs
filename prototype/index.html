<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amma Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: floating glass nav · bento hero · tinted product cards · floating cart dock. Palette: #3368A0 blue · #66A3BF sky · #C8DFDB mint · #F2EFE7 cream */
:root{
  --bg:#F2EFE7; --surface:#FFFFFF; --glass:rgba(255,255,255,.74); --sunk:#F6F3EC; --ink:#0F2236; --ink-2:#2B3F55; --muted:#5F6F80;
  --line:rgba(15,34,54,.09); --line-2:rgba(15,34,54,.18);
  --accent:#3368A0; --accent-ink:#FFFFFF; --accent-soft:#E3EDF6; --accent-deep:#21507F; --sky:#66A3BF; --mint:#C8DFDB;
  --dock:#0F2236; --dock-ink:#FFFFFF; --dock-2:rgba(255,255,255,.12);
  --ok:#2C7A6A; --ok-soft:#DCEEE9; --hi:#B83A30; --hi-soft:#F9E3DF; --lo:#94600E; --lo-soft:#F6EAD1;
  --tint-a:#C8DFDB; --tint-b:#D4E5EF; --tint-c:#EAE3D3;
  --grad:linear-gradient(140deg,#3368A0 0%,#4F8DB7 55%,#66A3BF 100%);
  --aura-1:rgba(102,163,191,.30); --aura-2:rgba(200,223,219,.85);
  --shadow-sm:0 1px 2px rgba(15,34,54,.05),0 4px 14px rgba(15,34,54,.05);
  --shadow:0 2px 6px rgba(15,34,54,.05),0 18px 40px rgba(15,34,54,.09);
  --shadow-lg:0 4px 10px rgba(15,34,54,.06),0 30px 60px rgba(15,34,54,.14);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:24px; --r-sm:14px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B131B; --surface:#121E29; --glass:rgba(18,30,41,.74); --sunk:#172532; --ink:#EAF0F4; --ink-2:#C8D4DD; --muted:#93A5B4;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --accent:#66A3BF; --accent-ink:#06131C; --accent-soft:#17303F; --accent-deep:#A8D0E0; --sky:#66A3BF; --mint:#2A4744;
  --dock:#EAF0F4; --dock-ink:#0F2236; --dock-2:rgba(15,34,54,.08);
  --ok:#6FC3AE; --ok-soft:#163730; --hi:#F08A80; --hi-soft:#3A1C1A; --lo:#E9B95E; --lo-soft:#372A12;
  --tint-a:#1D3835; --tint-b:#1A3143; --tint-c:#2A2822;
  --grad:linear-gradient(140deg,#24507F 0%,#336E95 55%,#4A8BA8 100%);
  --aura-1:rgba(102,163,191,.16); --aura-2:rgba(42,71,68,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 40px rgba(0,0,0,.35); --shadow-lg:0 30px 60px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B131B; --surface:#121E29; --glass:rgba(18,30,41,.74); --sunk:#172532; --ink:#EAF0F4; --ink-2:#C8D4DD; --muted:#93A5B4;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --accent:#66A3BF; --accent-ink:#06131C; --accent-soft:#17303F; --accent-deep:#A8D0E0; --sky:#66A3BF; --mint:#2A4744;
  --dock:#EAF0F4; --dock-ink:#0F2236; --dock-2:rgba(15,34,54,.08);
  --ok:#6FC3AE; --ok-soft:#163730; --hi:#F08A80; --hi-soft:#3A1C1A; --lo:#E9B95E; --lo-soft:#372A12;
  --tint-a:#1D3835; --tint-b:#1A3143; --tint-c:#2A2822;
  --grad:linear-gradient(140deg,#24507F 0%,#336E95 55%,#4A8BA8 100%);
  --aura-1:rgba(102,163,191,.16); --aura-2:rgba(42,71,68,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 40px rgba(0,0,0,.35); --shadow-lg:0 30px 60px rgba(0,0,0,.45); color-scheme:dark;
}
body.wire{ --accent:var(--ink); --accent-ink:var(--surface); --accent-soft:var(--sunk); --sky:var(--muted); --mint:var(--sunk);
  --tint-a:var(--sunk); --tint-b:var(--sunk); --tint-c:var(--sunk); --grad:linear-gradient(var(--muted),var(--muted)); --aura-1:transparent; --aura-2:transparent;
  --ok:var(--muted); --ok-soft:var(--sunk); --hi:var(--ink); --hi-soft:var(--sunk); --lo:var(--ink); --lo-soft:var(--sunk); --shadow:none; --shadow-lg:none; --shadow-sm:none }
body.wire .card, body.wire .panel, body.wire .bento > *, body.wire .cat, body.wire .step{border:1.5px dashed var(--line-2)!important}
body.wire .doll, body.wire .phone{filter:grayscale(1);opacity:.55}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:15px/1.55 var(--f);color:var(--ink);padding-bottom:110px;
  background:radial-gradient(900px 560px at 8% -8%,var(--aura-1),transparent 70%) no-repeat,radial-gradient(800px 520px at 96% 2%,var(--aura-2),transparent 70%) no-repeat,var(--bg);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em;text-wrap:balance;line-height:1.08}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
svg{display:block}
.link{color:var(--accent);font-weight:700}
.link:hover{text-decoration:underline}

/* ---- nav ---- */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;padding-inline:16px;margin-top:12px}
.nav-in{max-width:1168px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px;text-align:left;padding-right:8px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(51,104,160,.35)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.brand small{white-space:nowrap;display:block;font-size:11.5px;color:var(--muted);line-height:1.2;font-weight:600}
.links{display:flex;gap:2px;margin-left:8px}
.links button{white-space:nowrap;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);transition:background .2s,color .2s}
.links button:hover,.links button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-deep)}
.grow{flex:1}
.npill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap;transition:border-color .2s,transform .2s var(--spring)}
.npill:hover{border-color:var(--line-2)}
.npill:active{transform:scale(.96)}
.npill select{border:0;background:transparent;font-weight:700;outline:none;cursor:pointer}
.npill kbd{font:500 11px var(--f-mono);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.npill.srch{min-width:220px;color:var(--muted);font-weight:600}
.npill.srch span{flex:1;text-align:left}
.npill.dark{background:var(--dock);color:var(--dock-ink);border-color:var(--dock)}
.count{min-width:22px;height:22px;border-radius:11px;background:var(--sky);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--accent-deep);font-weight:800;font-size:14px;border:1px solid var(--line)}

/* ---- generic ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;transition:transform .2s var(--spring),box-shadow .2s,background .2s;text-decoration:none}
.btn:hover{box-shadow:0 10px 24px rgba(51,104,160,.28)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{box-shadow:var(--shadow-sm)}
.btn.dark{background:var(--dock);color:var(--dock-ink)}
.btn.white{background:#fff;color:#0F2236}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--dock);color:var(--dock-ink);border-color:var(--dock)}
label.chip select{border:0;background:transparent;font-weight:700;outline:none;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{height:50px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 14px;background:var(--surface);outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
.field textarea{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field input:disabled{background:var(--sunk);color:var(--muted)}
.err{font-size:12.5px;color:var(--hi)}
.phone-in{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.phone-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.phone-in span{padding:0 12px;display:grid;place-items:center;border-right:1px solid var(--line);color:var(--muted);font-weight:700}
.phone-in input{border:0!important;box-shadow:none!important;flex:1;min-width:0;height:50px;padding:0 12px;outline:none;background:transparent}
.crumbs{display:flex;gap:8px;font-size:13px;color:var(--muted);padding-top:28px;flex-wrap:wrap;font-weight:600}
.crumbs button{color:var(--muted)}
.crumbs button:hover{color:var(--accent)}
.sec{padding-block:56px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(26px,3.2vw,38px);margin-top:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm)}
.panel h2{font-size:19px;letter-spacing:-.02em}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r);display:grid;gap:12px;justify-items:center}
.ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
#view{animation:viewin .32s var(--ease)}
@keyframes viewin{from{transform:translateY(8px)}to{transform:none}}

/* ---- hero bento ---- */
.hero{padding-top:22px}
.bento{display:grid;grid-template-columns:1.32fr .68fr .68fr;grid-template-rows:auto auto;gap:14px}
.bento > *{border-radius:32px;position:relative;overflow:hidden}
.b-main{grid-column:1;grid-row:1/3;background:var(--surface);border:1px solid var(--line);padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow-sm)}
.b-main h1{font-size:clamp(40px,5.6vw,74px);line-height:.98;letter-spacing:-.045em}
.mark{background:linear-gradient(transparent 58%,var(--mint) 58%,var(--mint) 92%,transparent 92%);padding:0 .06em}
.b-main .lede{font-size:17.5px;color:var(--muted);max-width:50ch;font-weight:500}
.hsearch{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;height:66px;padding:0 8px 0 22px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:transform .25s var(--spring),box-shadow .25s}
.hsearch:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hsearch .tx{flex:1;color:var(--muted);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsearch .tx b{color:var(--ink);font-weight:700}
.hsearch .tx .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.hsearch .go{width:50px;height:50px;border-radius:50%;background:var(--dock);color:var(--dock-ink);display:grid;place-items:center;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);font-weight:600}
.chans{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.chan{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);transition:transform .2s var(--spring),background .2s}
.chan:hover{transform:translateY(-2px);background:var(--surface)}
.chan .ic{width:34px;height:34px;border-radius:50%}
.chan.wa .ic{background:#DDF3E4;color:#1E8C4E}
.b-phone{grid-column:2/4;grid-row:1;background:var(--grad);min-height:360px;color:#fff;padding:26px}
.b-phone h3{font-size:24px;max-width:13ch;letter-spacing:-.03em;position:relative;z-index:2}
.b-phone p{max-width:24ch;opacity:.85;font-size:14px;margin-top:8px;position:relative;z-index:2}
.b-phone .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
.b-phone .r1{width:420px;height:420px;right:-120px;top:-60px}
.b-phone .r2{width:280px;height:280px;right:-50px;top:10px}
.gchip{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:12.5px;font-weight:800;color:#fff;animation:floaty 5s ease-in-out infinite}
.gchip.c1{left:26px;bottom:26px}
.gchip.c2{left:26px;bottom:68px;animation-delay:-2.5s}
@keyframes floaty{50%{transform:translateY(-6px)}}
.phone{position:absolute;right:34px;top:30px;width:224px;height:440px;border-radius:38px;background:#0F2236;padding:8px;box-shadow:0 30px 60px rgba(6,20,36,.4);transform:rotate(-5deg);z-index:2}
.phone .scr{width:100%;height:100%;border-radius:31px;background:#F7F5EF;color:#0F2236;overflow:hidden;position:relative;padding:34px 12px 12px;display:grid;gap:8px;align-content:start}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:18px;border-radius:10px;background:#0F2236}
.phone .stat{position:absolute;top:10px;left:18px;font-size:10px;font-weight:800}
.ptoast{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 6px 16px rgba(15,34,54,.12);font-size:10.5px;line-height:1.3;animation:ptoast 6s var(--ease) infinite}
.ptoast b{display:block;font-size:11px}
.ptoast .pm{width:24px;height:24px;border-radius:8px;background:linear-gradient(140deg,#3368A0,#66A3BF);flex:none}
@keyframes ptoast{0%{transform:translateY(-70px);opacity:0}8%,82%{transform:none;opacity:1}92%,100%{transform:translateY(-70px);opacity:0}}
.pcard{background:#fff;border-radius:16px;padding:11px;box-shadow:0 2px 8px rgba(15,34,54,.06);display:grid;gap:8px}
.pcard h4{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.pcard small{font-size:9.5px;color:#5F6F80;font-weight:600}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:10.5px;font-weight:700;align-items:center}
.prow span:nth-child(2){font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:5px;border-radius:3px;background:#E8EEF2;position:relative;overflow:hidden}
.pbar::before{content:"";position:absolute;left:25%;right:25%;top:0;bottom:0;background:#C8DFDB}
.pbar i{position:absolute;top:-1px;width:4px;height:7px;border-radius:2px;background:#3368A0;left:var(--x);animation:pmark 1.4s var(--spring) both}
.pbar i.lo{background:#C78A1E}
@keyframes pmark{from{left:2%}}
.pflag{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:#DCEEE9;color:#2C7A6A;letter-spacing:.04em}
.pflag.l{background:#F6EAD1;color:#94600E}
.pbtn{height:28px;border-radius:999px;background:#0F2236;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.b-mini{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:6px;min-height:200px;box-shadow:var(--shadow-sm)}
.b-mini b,.b-mini span{display:block}
.b-mini b{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.b-mini span{color:var(--muted);font-size:13.5px;font-weight:500;line-height:1.4}
.b-pick{background:var(--tint-a);border-color:transparent}
.b-pick .art{position:absolute;right:-6px;bottom:-10px;background:transparent}
.b-pick > div{max-width:62%;position:relative;z-index:1}
.big-n{font-size:46px!important;font-weight:800;letter-spacing:-.05em;line-height:1!important;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.b-fast .bars{display:flex;gap:4px;align-items:end;height:38px;margin-top:auto}
.b-fast .bars i{flex:1;border-radius:4px;background:var(--accent-soft);height:var(--h);transform-origin:bottom;animation:grow 1.2s var(--spring) both}
.b-fast .bars i:last-child{background:var(--accent)}
@keyframes grow{from{transform:scaleY(.2)}}

/* ---- marquee ---- */
.marquee{margin-top:18px;overflow:hidden;border-block:1px solid var(--line);padding-block:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq{display:flex;gap:40px;width:max-content;animation:mq 38s linear infinite}
.mq span{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.mq span svg{color:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---- categories ---- */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:168px;padding:16px;border-radius:24px;background:var(--tint-a);text-align:left;overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s}
.cat.t-b{background:var(--tint-b)} .cat.t-c{background:var(--tint-c)}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cat b{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2;position:relative;z-index:1}
.cat small{display:block;color:var(--ink-2);opacity:.75;font-weight:700;font-size:12.5px;margin-top:2px}
.cat .art{position:absolute;right:-4px;bottom:-4px;background:transparent!important}
.cat .arr{position:absolute;left:16px;bottom:16px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;transition:transform .3s var(--spring)}
.cat:hover .arr{transform:rotate(-45deg)}

/* ---- product cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,290px);gap:16px;overflow-x:auto;padding:4px 4px 16px;margin:-4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:8px;display:flex;flex-direction:column;min-width:0;transition:transform .35s var(--spring),box-shadow .35s,border-color .35s}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:transparent}
.media{position:relative;height:168px;border-radius:20px;background:var(--tint-a);display:grid;place-items:center;overflow:hidden}
.media.t-b{background:var(--tint-b)} .media.t-c{background:var(--tint-c)}
.media::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%)}
.media .art{position:relative;transition:transform .4s var(--spring)}
.card:hover .media .art{transform:scale(1.07) translateY(-2px)}
.badge{position:absolute;top:10px;left:10px;z-index:2;padding:5px 10px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
.disc{position:absolute;top:10px;right:10px;z-index:2;padding:5px 10px;border-radius:999px;background:var(--dock);color:var(--dock-ink);font-size:11.5px;font-weight:800}
.cbody{padding:14px 10px 8px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.28}
.cbody h3 button{text-align:left}
.cbody h3 button:hover{color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pill.warn{background:var(--lo-soft);color:var(--lo);border-color:transparent}
button.pill:hover{border-color:var(--line-2)}
.pill svg{transition:transform .2s}
.inc[aria-expanded="true"] svg{transform:rotate(180deg)}
.incl{margin:0;padding:10px 12px 10px 28px;background:var(--sunk);border-radius:var(--r-sm);font-size:13px;color:var(--muted);display:grid;gap:3px;font-weight:500}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price{font-size:22px;font-weight:800;letter-spacing:-.03em}
.prices s{color:var(--muted);font-size:13.5px;font-weight:600}
.off{color:var(--ok);font-weight:800;font-size:13.5px}
.add{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 18px 0 14px;border-radius:999px;background:var(--dock);color:var(--dock-ink);font-weight:800;font-size:14px;transition:transform .25s var(--spring),background .25s,color .25s}
.add:hover{transform:scale(1.04)}
.add:active{transform:scale(.94)}
.add.on{background:var(--mint);color:var(--accent-deep)}
.add.on svg{animation:pop .4s var(--spring)}
@keyframes pop{0%{transform:scale(0) rotate(-45deg)}}
.tat{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin:0}

/* ---- how it works ---- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:10px;position:relative;box-shadow:var(--shadow-sm)}
.step .n{font:500 12px var(--f-mono);color:var(--accent-deep);background:var(--mint);padding:4px 10px;border-radius:999px;justify-self:start}
.step h3{font-size:20px}
.step p{color:var(--muted);font-weight:500}
.step .art{justify-self:end;margin-top:-6px}
.step:not(:last-child)::after{content:"";position:absolute;right:-14px;top:50%;width:14px;border-top:2px dashed var(--line-2)}

/* ---- CTA band ---- */
.cta{margin-top:56px;border-radius:36px;background:var(--grad);color:#fff;padding:clamp(26px,4vw,48px);display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(28px,3.6vw,44px);max-width:16ch}
.cta p{opacity:.88;max-width:46ch;margin:12px 0 22px;font-weight:500}
.cta .dolls{display:flex;justify-content:flex-end;gap:10px;position:relative;z-index:1}
.cta .dolls .art{background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.25)}
.cta .dolls .art:nth-child(2){transform:translateY(-18px)}
.cta .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.18);width:520px;height:520px;right:-160px;top:-180px}

/* ---- listing ---- */
.lhead{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding-block:10px 18px}
.lhead h1{font-size:clamp(30px,4.2vw,50px);letter-spacing:-.04em}
.lhead p{color:var(--muted);font-weight:600;margin-top:6px}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow button{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;transition:all .2s var(--ease)}
.catrow button:hover{border-color:var(--line-2)}
.catrow button[aria-current="true"]{background:var(--dock);color:var(--dock-ink);border-color:var(--dock)}
.catrow .art{border-radius:50%}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;margin-bottom:18px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.toolbar .chip{height:36px}

/* ---- cart, checkout ---- */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start;padding-block:18px 24px}
.stack{display:grid;gap:16px}
.sticky{position:sticky;top:96px}
.citem{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.citem:first-of-type{border-top:0}
.citem > .grow{min-width:0}
.citem b{display:block;font-weight:800;letter-spacing:-.01em}
.rm{height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-weight:700;font-size:13px;color:var(--hi);transition:all .2s}
.rm:hover{background:var(--hi-soft);border-color:transparent}
.sum{display:grid;gap:9px;font-variant-numeric:tabular-nums;font-weight:600}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum div span:first-child{min-width:0}
.sum .ok{color:var(--ok)}
.sum .tot{border-top:1px dashed var(--line-2);padding-top:12px;margin-top:4px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);transition:border-color .2s,background .2s}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.coupons{display:grid;gap:8px}
.coupon{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1.5px dashed var(--line-2);border-radius:var(--r-sm)}
.coupon code{font:500 13px var(--f-mono);color:var(--accent-deep);background:var(--mint);padding:2px 8px;border-radius:6px}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{min-width:86px;padding:9px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);text-align:center;font-size:13.5px;font-weight:700;transition:all .2s var(--ease)}
.slot b{display:block;font-size:16px;font-weight:800}
.slot span{color:var(--muted);font-weight:600}
.slot[aria-pressed="true"]{border-color:var(--dock);background:var(--dock);color:var(--dock-ink)}
.slot[aria-pressed="true"] span{color:inherit;opacity:.7}
.slot[disabled]{opacity:.35;cursor:not-allowed}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--lo-soft);color:var(--lo);font-size:13.5px;font-weight:600}
.note.info{background:var(--accent-soft);color:var(--accent-deep)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step-h{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.step-h span{width:30px;height:30px;border-radius:50%;background:var(--dock);color:var(--dock-ink);display:grid;place-items:center;font:500 13px var(--f-mono)}

/* ---- orders & report ---- */
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 4px}
.track div{display:grid;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.track i{height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.track .done i{background:var(--grad);border-color:transparent}
.track .done{color:var(--ink);font-weight:800}
.olist{display:grid;gap:14px}
.ohead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.ohead > div{min-width:0}
.rep-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px;background:var(--sunk);border-radius:var(--r-sm);font-size:13.5px}
.rep-meta span{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tbl{overflow-x:auto;margin-top:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr.grp td{background:var(--sunk);font-weight:800;font-size:13px}
td.v{font-weight:800}
.flag{font:500 11px var(--f-mono);padding:4px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.flag.n{color:var(--ok);background:var(--ok-soft)}
.flag.h{color:var(--hi);background:var(--hi-soft)}
.flag.l{color:var(--lo);background:var(--lo-soft)}
.rbar{position:relative;width:130px;height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.rbar::before{content:"";position:absolute;left:25%;right:25%;top:0;bottom:0;background:var(--mint)}
.rbar b{position:absolute;top:-5px;width:4px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.rep-sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .5s var(--spring)}

/* ---- dock, toast, sheet, palette ---- */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:min(560px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:999px;background:var(--dock);color:var(--dock-ink);box-shadow:var(--shadow-lg);transform:translate(-50%,140%);opacity:0;visibility:hidden;transition:transform .45s var(--spring),opacity .3s,visibility .3s}
.dock.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.dock .stackav{display:flex}
.dock .stackav .art{border-radius:50%;border:2px solid var(--dock);margin-left:-12px}
.dock .stackav .art:first-child{margin-left:0}
.dock .what{flex:1;min-width:0;line-height:1.25}
.dock .what b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.dock .what span{display:block;font-size:12.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{background:var(--dock-2);color:var(--dock-ink);height:46px}
.dock .btn.white{background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 82px);z-index:70;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:var(--dock);color:var(--dock-ink);padding:10px 16px 10px 12px;border-radius:999px;font-weight:700;font-size:14px;transition:all .3s var(--spring);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:20px;height:20px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:#fff;flex:none}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,16,26,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:30px;padding:26px;box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.98);transition:transform .35s var(--spring)}
.scrim.show .sheet{transform:none}
.sheet-h{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:18px}
.sheet-h h2{font-size:24px}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:none;transition:transform .2s}
.x:hover{transform:rotate(90deg)}
.otp{display:flex;gap:8px}
.otp input{width:100%;min-width:0;height:58px;text-align:center;font:700 24px var(--f);border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:all .2s}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);transform:translateY(-2px)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.demo{font-size:13px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk);color:var(--muted);font-weight:600}
.demo b{font-family:var(--f-mono);color:var(--ink);letter-spacing:.14em}
.bignum{font-size:26px;font-weight:800;letter-spacing:-.02em;user-select:all}
.detail-list{columns:2;column-gap:20px;margin:0;padding-left:18px;font-size:14px;color:var(--muted);font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.facts div{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:700}
.facts span{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.detail-top{display:flex;gap:16px;align-items:center}
.pal-scrim{place-items:start center;padding-top:min(12vh,110px)}
.pal{width:100%;max-width:640px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .35s var(--spring)}
.scrim.show .pal{transform:none}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal-in svg{color:var(--muted);flex:none}
.pal-in input{flex:1;min-width:0;height:64px;border:0;outline:none;background:transparent;font-size:18px;font-weight:600}
.pal-in kbd{font:500 11px var(--f-mono);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--muted)}
.pal-body{max-height:min(60vh,520px);overflow:auto;padding:10px}
.pal-label{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 8px}
.pal-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;transition:background .15s}
.pal-row:hover,.pal-row.sel{background:var(--sunk)}
.pal-row .nm{flex:1;min-width:0;text-align:left;font-weight:700;line-height:1.3}
.pal-row .nm span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.pal-row .add{height:36px;padding:0 14px 0 10px;font-size:13px}
.pal-chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 10px 10px}
.pal-empty{padding:24px 12px;color:var(--muted);text-align:center;font-weight:600}

/* ---- footer ---- */
.foot{margin-top:72px;border-top:1px solid var(--line);background:var(--surface)}
.foot-in{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:28px;padding-block:36px}
.foot h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-weight:700}
.foot ul button:hover{color:var(--accent)}
.foot form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.foot form .phone-in{flex:1;min-width:200px}
.foot-base{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.switch i{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .25s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-pressed="true"] i{background:var(--accent)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px)}

/* ---- illustrated characters ---- */
.art{display:block;width:76px;height:76px;border-radius:20px;overflow:hidden;flex:none;background:var(--tint-a);transition:transform .3s var(--spring)}
.art.t-b{background:var(--tint-b)} .art.t-c{background:var(--tint-c)}
.art.xs{width:44px;height:44px;border-radius:14px}
.art.sm{width:56px;height:56px;border-radius:16px}
.art.md{width:96px;height:96px;background:transparent}
.art.lg{width:112px;height:112px;border-radius:30px}
.art.xl{width:136px;height:136px;background:transparent!important;border-radius:0;overflow:visible}
.art svg{width:100%;height:100%;overflow:hidden}
.art.yay{animation:yay .65s var(--spring)}
@keyframes yay{30%{transform:translateY(-14px) scale(1.1) rotate(-5deg)}60%{transform:translateY(0) scale(.96)}100%{transform:none}}
.doll *{transform-box:view-box}
.doll .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--d)}
.doll .hd,.doll .bob{animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d)}
.doll .b2{animation-delay:calc(var(--d) - 1.3s)}
.doll .arm{transform-origin:61px 76px;animation:curl 2.6s ease-in-out infinite;animation-delay:var(--d)}
.doll .wave{transform-origin:62px 78px;animation:wave 3.6s ease-in-out infinite;animation-delay:var(--d)}
.doll .pony{transform-origin:52px 24px;animation:swing 2.6s ease-in-out infinite}
.doll .float{animation:rise 2.8s ease-out infinite;animation-delay:var(--d)}
.doll .twk{transform-box:fill-box;transform-origin:center;animation:twk 2.4s ease-in-out infinite;animation-delay:var(--d)}
.doll .t2{animation-delay:calc(var(--d) - 1.1s)}
.doll .wing{transform-origin:40px 40px;animation:flap 1.7s ease-in-out infinite}
.doll .bub{animation:bubble 2.2s ease-in infinite;animation-delay:var(--d)}
.doll .spin{transform-origin:40px 40px;animation:spin 14s linear infinite}
.doll .drift{animation:drift 4s ease-in-out infinite}
.doll .wob{transform-origin:40px 66px;animation:wob 3s ease-in-out infinite;animation-delay:var(--d)}
.doll .sway{transform-origin:40px 74px;animation:wob 3.4s ease-in-out infinite;animation-delay:var(--d)}
.doll .merc{transform-origin:40px 56px;animation:merc 3s ease-in-out infinite}
.doll .drip{animation:drip 2.4s ease-in infinite}
.doll .hov{animation:hov 2.2s ease-in-out infinite;animation-delay:var(--d)}
.doll .flut{transform-origin:40px 31px;animation:flut .22s linear infinite alternate}
.doll .lens{animation:lens 3.4s ease-in-out infinite}
.doll .scan{animation:scan 2.6s ease-in-out infinite alternate}
.doll .pulse{stroke-dasharray:90;animation:dash 2.4s linear infinite}
.doll .beat{transform-origin:40px 44px;animation:beat 1.2s ease-in-out infinite}
.doll .ping{transform-origin:40px 30px;animation:ping 2s ease-out infinite}
.doll .tap{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-1.8px)}}
@keyframes curl{50%{transform:rotate(-16deg)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-14deg)}75%{transform:rotate(6deg)}85%{transform:rotate(-10deg)}}
@keyframes swing{50%{transform:rotate(9deg)}}
@keyframes rise{0%{transform:translateY(6px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translateY(-10px) scale(1);opacity:0}}
@keyframes twk{50%{transform:scale(.55) rotate(45deg);opacity:.6}}
@keyframes flap{50%{transform:scaleX(.72)}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translate(-2px,-3px)}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes merc{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(8px);opacity:0}}
@keyframes hov{50%{transform:translate(2px,-3px)}}
@keyframes flut{to{transform:scaleY(.55)}}
@keyframes lens{50%{transform:translate(-6px,6px)}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(54px)}}
@keyframes dash{from{stroke-dashoffset:90}to{stroke-dashoffset:-90}}
@keyframes beat{0%,40%,100%{transform:scale(1)}20%{transform:scale(1.08)}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}

function shade(hex,amt){ const n=parseInt(hex.slice(1),16); return '#'+[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,'0')).join(''); }
const hash=s=>{ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); };

function applyFilt(list){

  if(f.sort==='pop') l.sort((a,b)=>(b.best||0)-(a.best||0));

function find(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const words=q.split(/\s+/);
  return T.filter(t=>{ const h=(t.name+' '+(t.inc||[]).join(' ')+' '+t.cats.join(' ')).toLowerCase(); return words.every(w=>h.includes(w)); })
          .sort((a,b)=>(a.name.toLowerCase().startsWith(q)?-1:0)-(b.name.toLowerCase().startsWith(q)?-1:0));
}

function bill(){
  const items=S.cart.map(id=>BY[id]);
  const mrp=items.reduce((s,t)=>s+t.mrp,0), price=items.reduce((s,t)=>s+t.price,0);
  let cpn=0;
  if(S.coupon==='AMMA10') cpn=Math.min(300,Math.round(price*0.1));
  if(S.coupon==='FIRST100') cpn=price>=999?100:0;
  const home=items.some(t=>!t.visit);
  const fee=home&&(price-cpn)<CONFIG.freeAbove?CONFIG.collectFee:0;
  const hard=S.hard&&items.length?CONFIG.hardCopy:0;

/* sample report */
function rng(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;} return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;}; }
V.report = id=>{
  const o=S.orders.find(x=>x.id===id); if(!o) return V.orders();
  const r=rng(o.id); let rows='', total=0, inR=0; const seen=new Set();
  o.items.forEach(tid=>{
    const t=BY[tid]; if(!t) return;
    let body='';
    if(t.q){ body=`<tr><td>${esc(t.name)}</td><td class="v">${t.visit?'See radiologist note':'Negative'}</td><td></td><td class="muted">${t.visit?'—':'Negative'}</td><td></td><td><span class="flag n">Normal</span></td></tr>`; total++; inR++; }
    (t.p||[]).forEach(k=>{
      const names=G[k]||[k];
      if(G[k]) body+=`<tr class="grp"><td colspan="6">${GN[k]}</td></tr>`;
      names.forEach(n=>{
        if(seen.has(n)||!REF[n]) return; seen.add(n);
        const [lo,hi,u,dp]=REF[n], a=r(), w=r(); let v;
        if(a<.1) v=lo*(1-.08-.2*w); else if(a>.88) v=hi+(hi-lo)*.22*w; else v=lo+(hi-lo)*(.12+.76*w);
        v=Math.max(v,0); const vs=v.toFixed(dp); const vn=+vs;
        const fl=vn<lo?'l':vn>hi?'h':'n'; total++; if(fl==='n') inR++;
        const span=hi-lo, pos=Math.min(98,Math.max(2,((vn-(lo-span/2))/(span*2))*100));
        body+=`<tr><td>${esc(n)}</td><td class="v">${vs}</td><td class="muted">${u}</td><td class="muted">${lo} – ${hi}</td><td><div class="rbar" aria-hidden="true"><b style="left:${pos}%"></b></div></td><td><span class="flag ${fl}">${fl==='n'?'Normal':fl==='h'?'High':'Low'}</span></td></tr>`;
      });
    });
    if(body) rows+=`<tr><td colspan="6" style="padding-top:18px;border-bottom:0"><b style="font-family:var(--f-display);font-size:16px">${esc(t.name)}</b></td></tr>`+body;
  });
  const out=total-inR;
  return `<div class="wrap">
  <nav class="crumbs"><button data-act="go" data-to="home">Home</button><span>›</span><button data-act="go" data-to="orders">My orders & reports</button><span>›</span><span>Report</span></nav>
  <div class="list-head"><h1>Lab report</h1><div class="bar"><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('My Amma Labs report for order '+o.id+' is ready.')}">${I('wa',18)} Share on WhatsApp</a></div></div>
  <div class="panel">
    <div class="note" style="margin-bottom:14px">Sample report with example values, generated for this wireframe. Not a real result.</div>
    <div class="rep-meta">
      <div><span>Patient</span><b>${esc(o.patient.name)}</b>${o.patient.age?`, ${esc(o.patient.age)} y`:''}${o.patient.gender?` · ${esc(o.patient.gender)}`:''}</div>
      <div><span>Order ID</span><b class="mono">${o.id}</b></div>
      <div><span>Sample collected</span><b>${esc(o.slot)}</b></div>
      <div><span>Verified by</span><b>Consultant pathologist</b></div>
    </div>
    <div class="rep-sum"><span class="flag n">${inR} within range</span>${out?`<span class="flag h">${out} outside range</span>`:''}</div>
    <div class="tbl"><table><thead><tr><th>Parameter</th><th>Result</th><th>Unit</th><th>Reference range</th><th>Where it sits</th><th>Flag</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin:14px 0 0">Reference ranges are for adults and can vary with age and sex. Discuss any flagged value with your doctor.</p>
  </div></div>`;
};

  otpCode=String(Math.floor(100000+Math.random()*900000));
  openSheet(`${sheetHead('Enter OTP',`Sent to +91 ${phone.slice(0,5)} ${phone.slice(5)} · <button class="link" data-act="editNum">Change</button>`)}
    <form id="of" class="stack" style="gap:14px" novalidate>
      <div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}"${i===0?' autocomplete="one-time-code"':''}>`).join('')}</div>
      <span class="err" id="otpE" style="color:var(--hi);font-size:12.5px"></span>
      <div class="demo">Demo mode: SMS is not connected yet. Your code is <b>${otpCode}</b></div>
      <button class="btn block" type="submit">Verify and continue</button>
      <p class="muted" style="margin:0;font-size:13.5px;text-align:center" id="resend"></p>
    </form>`, ()=>{ S._pend={name,phone}; startResend(); });
  sheetCleanup=()=>clearInterval(otpTimer);
}
function startResend(){
  let s=30; const el=$('#resend'); clearInterval(otpTimer);
  const tick=()=>{ if(!el.isConnected){clearInterval(otpTimer);return;} el.innerHTML= s>0?`Resend code in 0:${String(s).padStart(2,'0')}`:`Didn't get it? <button class="link" data-act="resend">Resend OTP</button>`; s--; if(s<-1) clearInterval(otpTimer); };
  tick(); otpTimer=setInterval(tick,1000);
}
function verifyOtp(){
  const v=$$('#otp input').map(i=>i.value).join('');
  if(v.length<6){ $('#otpE').textContent='Enter all 6 digits.'; return; }
  if(v!==otpCode){ $('#otpE').textContent="That code doesn't match. Check the message and try again."; const o=$('#otp'); o.classList.remove('shake'); void o.offsetWidth; o.classList.add('shake'); $$('#otp input').forEach(i=>i.value=''); $('#otp input').focus(); return; }
  S.user={name:S._pend.name, phone:S._pend.phone}; save(); closeSheet(); toast(`Welcome, ${S.user.name.split(' ')[0]}`);
  const a=S.afterLogin; S.afterLogin=null; if(a) go(a); else syncChrome();
}
const validPhone=p=>/^[6-9]\d{9}$/.test(p);

/* ---------- search palette ---------- */
const q=$('#q'), drop=$('#drop'), pal=$('#palScrim'); let sel=-1, res=[];
function openPal(){ pal.hidden=false; requestAnimationFrame(()=>pal.classList.add('show')); q.value=''; sel=-1; drawDrop(); setTimeout(()=>q.focus(),20); }
function closePal(){ if(pal.hidden) return; pal.classList.remove('show'); setTimeout(()=>{pal.hidden=true;},180); }
function drawDrop(){
  const v=q.value.trim();
  if(!v){
    const pop=T.filter(t=>t.best).slice(0,5);
    drop.innerHTML=`<div class="pal-label">Popular searches</div><div class="pal-chips">${['Thyroid','Vitamin D','Full body','HbA1c','Liver','Allergy','Fever'].map(s=>`<button class="chip" data-act="qs" data-q="${s}">${s}</button>`).join('')}</div>
      <div class="pal-label">Most booked</div>${pop.map((t,i)=>palRow(t,i)).join('')}`;
    res=pop; return;
  }
  res=find(v).slice(0,7); sel=Math.min(sel,res.length-1);
  drop.innerHTML = res.length? `<div class="pal-label">${find(v).length} results</div>`+res.map((t,i)=>palRow(t,i)).join('')
    + `<div class="pal-row"><button class="nm link" data-act="seeAll">See all results for “${esc(v)}” →</button></div>`
    : `<div class="pal-empty">No tests found for “${esc(v)}”. Try “thyroid”, “vitamin” or “liver”.</div>`;
}
function palRow(t,i){ return `<div class="pal-row${i===sel?' sel':''}">${art(t,'xs')}<button class="nm" data-act="detail" data-id="${t.id}">${esc(t.name)}<span>${inr(t.price)} · report in ${t.tat} hrs</span></button><button class="add${inCart(t.id)?' on':''}" data-act="add" data-add="${t.id}">${addLbl(inCart(t.id))}</button></div>`; }
q.addEventListener('input',()=>{ sel=-1; drawDrop(); });
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,res.length-1); drawDrop(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,-1); drawDrop(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(sel>-1&&res[sel]){ closePal(); detail(res[sel].id); } else if(q.value.trim()){ const v=q.value.trim(); closePal(); go('search',v); } }
  else if(e.key==='Escape'){ closePal(); }
});
pal.addEventListener('click',e=>{ if(e.target===pal) closePal(); });
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#scrim')){ closeSheet(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  switch(a){
    case 'go': closePal(); if(el.dataset.to==='cat') S.filt={pkg:false,fast24:false,nofast:false,sort:'pop'}; go(el.dataset.to, el.dataset.arg); break;
    case 'add': toggleCart(el.dataset.add); if(!pal.hidden) drawDrop(); break;
    case 'addClose': toggleCart(el.dataset.id); closeSheet(); break;
    case 'detail': closePal(); detail(el.dataset.id); break;
    case 'inc': { const ul=el.closest('.card,.sheet').querySelector('.incl'); const open=el.getAttribute('aria-expanded')==='true'; el.setAttribute('aria-expanded',!open); ul.hidden=open; break; }
    case 'filt': S.filt[el.dataset.k]=!S.filt[el.dataset.k]; render(false); break;
    case 'close': closeSheet(); break;
    case 'user': S.user?go('orders'):loginSheet(); break;
    case 'logout': S.user=null; save(); toast('Logged out'); go('home'); break;
    case 'call': callSheet(); break;
    case 'wa': { const b=bill(); const txt=b.items.length?`Hi Amma Labs, I'd like to book these tests in ${S.city}:\n${b.items.map(t=>'• '+t.name+' ('+inr(t.price)+')').join('\n')}\nTotal: ${inr(b.total)}`:`Hi Amma Labs, I'd like to book a test in ${S.city}.`; el.href=`https://wa.me/${CONFIG.wa}?text=${encodeURIComponent(txt)}`; break; }
    case 'upload': $('#rx').click(); break;
    case 'search': openPal(); break;
    case 'qs': q.value=el.dataset.q; sel=-1; drawDrop(); q.focus(); break;
    case 'seg': S.seg=el.dataset.k; $$('[data-act="seg"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===S.seg)); { const r=$('#pkRail'); r.innerHTML=segList().map(card).join(''); r.scrollLeft=0; } break;
    case 'rail': { const r=el.closest('section').querySelector('.rail'); r.scrollBy({left:(+el.dataset.dir)*r.clientWidth*.8,behavior:'smooth'}); break; }
    case 'how': { const doIt=()=>document.getElementById('how')?.scrollIntoView({behavior:'smooth',block:'start'}); if(S.view!=='home'){ go('home'); setTimeout(doIt,60);} else doIt(); break; }
    case 'seeAll': { const v=q.value.trim(); closePal(); go('search',v); break; }
    case 'copy': { const v=el.dataset.v; const ok=()=>toast('Number copied'); try{ navigator.clipboard.writeText(v).then(ok,()=>toast('Select the number to copy it')); }catch(err){ toast('Select the number to copy it'); } break; }
    case 'coupon': S.coupon=el.dataset.c||null; save(); render(false); toast(S.coupon?`${S.coupon} applied`:'Coupon removed'); break;
    case 'checkout': if(!S.user) loginSheet('checkout'); else go('checkout'); break;
    case 'date': keepCo(); S.co.date=+el.dataset.i; render(false); break;
    case 'time': keepCo(); S.co.time=el.dataset.s; render(false); break;
    case 'advance': { const o=S.orders.find(x=>x.id===el.dataset.id); if(o){ o.status=Math.min(3,o.status+1); save(); render(false); toast(STAT[o.status]); } break; }
    case 'editNum': loginSheet(S.afterLogin); break;
    case 'resend': otpCode=String(Math.floor(100000+Math.random()*900000)); $('.demo b').textContent=otpCode; startResend(); toast('New code sent (demo)'); break;
    case 'wire': S.wire=!S.wire; save(); syncChrome(); break;
  }
});
function keepCo(){ const g=id=>{ const x=document.getElementById(id); return x?x.value:undefined; };
  const c=S.co; c.age=g('pAge')??c.age; c.gender=g('pGender')??c.gender; c.addr=g('pAddr')??c.addr; c.pin=g('pPin')??c.pin;
  const pn=g('pName'); if(pn!==undefined) c.name=pn; const p=document.querySelector('input[name="pay"]:checked'); if(p) c.pay=p.value; }

document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='lf'){
    const name=$('#lName').value.trim(), ph=$('#lPhone').value.replace(/\D/g,'');
    $('#lNameE').textContent= name.length<2?'Enter your name as it should appear on the report.':'';
    $('#lPhoneE').textContent= validPhone(ph)?'':'Enter a 10-digit Indian mobile number starting with 6, 7, 8 or 9.';
    if(name.length>=2&&validPhone(ph)) otpSheet(name,ph);
  }
  if(f.id==='of') verifyOtp();
  if(f.id==='cb2'){ const ph=$('#cb2Phone').value.replace(/\D/g,''); if(!validPhone(ph)){ $('#cb2Err').textContent='Enter a 10-digit mobile number.'; return;} closeSheet(); toast('Call back requested (demo — not sent yet)'); }
  if(f.id==='cbForm'){ const ph=$('#cbPhone').value.replace(/\D/g,''); if(!validPhone(ph)){ toast('Enter a 10-digit mobile number'); $('#cbPhone').focus(); return;} $('#cbPhone').value=''; toast('Call back requested (demo — not sent yet)'); }
  if(f.id==='coForm'){
    keepCo(); const b=bill(), c=S.co; let ok=true;
    const set=(id,m)=>{ const x=document.getElementById(id); if(x) x.textContent=m; if(m) ok=false; };
    set('eName',(c.name||'').trim().length<2?'Enter the patient name.':'');
    set('eAge',!(+c.age>0&&+c.age<120)?'Enter age in years.':'');
    set('eGender',c.gender?'':'Select gender.');
    if(b.home){ set('eAddr',(c.addr||'').trim().length<8?'Enter the full address for sample pickup.':''); set('ePin',/^5\d{5}$/.test(c.pin||'')?'':'Enter a 6-digit Karnataka pincode (starts with 5).'); }
    set('eSlot',c.time?'':'Pick a time slot.');
    if(!ok){ const first=[...document.querySelectorAll('.err')].find(x=>x.textContent); first&&first.scrollIntoView({block:'center',behavior:'smooth'}); return; }
    const d=days()[c.date];
    const o={ id:'AL-'+Math.random().toString(36).slice(2,8).toUpperCase(), items:S.cart.slice(), total:b.total, status:0, phone:S.user.phone,
      slot:`${d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}, ${c.time}`, pay:c.pay,
      patient:{name:c.name.trim(),age:c.age,gender:c.gender} };
    S.orders.push(o); S.cart=[]; S.coupon=null; S.co={date:0,time:'',pay:'cod'}; save(); go('done',o.id);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){ S.filt.sort=e.target.value; render(false); }
  if(e.target.id==='hard'){ S.hard=e.target.checked; save(); render(false); }
  if(e.target.id==='city'){ S.city=e.target.value; save(); render(false); toast(`Showing tests in ${S.city}`); }
  if(e.target.id==='rx'){ const f=e.target.files[0]; if(!f) return; openSheet(`${sheetHead('Prescription received')}
    <div class="panel" style="display:flex;gap:12px;align-items:center"><span class="ic">${I('rx')}</span><div style="min-width:0"><b style="word-break:break-all">${esc(f.name)}</b><div class="muted" style="font-size:13px">${(f.size/1024).toFixed(0)} KB</div></div></div>
    <p>Our team reads the prescription, picks the matching tests and calls you to confirm the price and slot.</p>
    <div class="demo">Demo mode: the file stays in this browser and is not uploaded.</div>
    <button class="btn block" style="margin-top:16px" data-act="close">Done</button>`); e.target.value=''; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#otp')){
    t.value=t.value.replace(/\D/g,'').slice(-1);
    if(t.value&&t.nextElementSibling) t.nextElementSibling.focus();
    if($$('#otp input').every(i=>i.value)) verifyOtp();
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#otp')&&e.key==='Backspace'&&!t.value&&t.previousElementSibling){ t.previousElementSibling.focus(); }
  if(e.key==='Escape'&&!$('#scrim').hidden) closeSheet();
  if((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))||(e.key.toLowerCase()==='k'&&(e.metaKey||e.ctrlKey))){ e.preventDefault(); openPal(); }
});
document.addEventListener('paste',e=>{
  if(!e.target.closest||!e.target.closest('#otp')) return;
  const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if(!d) return;
  e.preventDefault(); const ins=$$('#otp input'); d.split('').forEach((c,i)=>ins[i]&&(ins[i].value=c)); (ins[d.length]||ins[5]).focus(); if(d.length===6) verifyOtp();
});

render();
})();
</script>

</body>
</html>
